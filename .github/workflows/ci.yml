name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KitchenAssistant.slnx

      - name: Build
        run: dotnet build KitchenAssistant.slnx -c Release --no-restore

      - name: Check for pending model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release

      - name: Test
        id: test
        run: dotnet test KitchenAssistant.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Assert tests ran
        if: always() && steps.test.conclusion != 'skipped'
        run: pwsh scripts/ci/assert-tests-ran.ps1 -ResultsDirectory TestResults

  vulnerable-packages:
    name: vulnerable-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KitchenAssistant.slnx

      - name: List vulnerable packages
        run: dotnet list KitchenAssistant.slnx package --vulnerable --include-transitive --format json > vulnerable.json

      - name: Fail on High or Critical advisories
        run: pwsh scripts/ci/assert-no-vulnerable-packages.ps1 -Path vulnerable.json
